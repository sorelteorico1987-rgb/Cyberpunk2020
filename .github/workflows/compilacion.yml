name: Compilación y autopruebas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar dependencias
        run: dotnet restore
      - name: Compilar
        run: dotnet build --no-restore --configuration Release
      - name: Ejecutar autopruebas
        run: dotnet run --no-build --configuration Release -- --autoprueba
